<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10242a">
  <meta name="description" content="西澳自驾路线离线攻略地图">
  <title>West Coast of AUS Route Map</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/magic-map.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/vendor/leaflet/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #10242a;
      --muted: #60747a;
      --paper: #fbfbf7;
      --panel: rgba(255, 255, 251, 0.94);
      --line: rgba(16, 36, 42, 0.12);
      --sea: #0f7b83;
      --sea-deep: #0a4f58;
      --coral: #ee6f57;
      --gold: #f2bd4b;
      --green: #3b7b5e;
      --rose: #c85f7c;
      --shadow: 0 22px 60px rgba(8, 24, 31, 0.22);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    .app {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #dfe8e7;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .app {
      position: relative;
      min-height: 100dvh;
    }

    #map {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #d7e7e8 0%, #eef3ed 58%, #e5ded4 100%);
      z-index: 1;
    }

    .topbar {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: min(560px, calc(100vw - 178px));
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: var(--radius);
      background: rgba(255, 255, 251, 0.88);
      box-shadow: 0 12px 36px rgba(17, 43, 51, 0.16);
      backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      background: conic-gradient(from 210deg, var(--sea), var(--green), var(--gold), var(--coral), var(--sea));
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.34);
      font-size: 17px;
      font-weight: 800;
    }

    .brand p,
    .brand h1 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand p {
      color: var(--sea-deep);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .brand h1 {
      color: var(--ink);
      font-size: 17px;
      line-height: 1.25;
      font-weight: 850;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      background: rgba(255, 255, 251, 0.9);
      box-shadow: 0 12px 36px rgba(17, 43, 51, 0.16);
      backdrop-filter: blur(18px);
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .icon-btn.active {
      color: #fff;
      background: var(--sea-deep);
    }

    .offline-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      color: var(--sea-deep);
      background: rgba(255, 255, 251, 0.9);
      box-shadow: 0 12px 36px rgba(17, 43, 51, 0.14);
      backdrop-filter: blur(18px);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .offline-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(59, 123, 94, 0.12);
    }

    body.offline .offline-status,
    body.map-offline .offline-status {
      color: #7b3f21;
    }

    body.offline .offline-status::before,
    body.map-offline .offline-status::before {
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(242, 189, 75, 0.18);
    }

    .sheet {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      flex-direction: column;
      height: var(--sheet-height, min(78dvh, 700px));
      max-height: calc(100dvh - 88px - env(safe-area-inset-top));
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(22px);
      transform: translateZ(0);
      transition: height 220ms ease;
      touch-action: none;
    }

    .sheet.compact {
      height: min(46dvh, 420px);
    }

    .sheet.expanded {
      height: calc(100dvh - 88px - env(safe-area-inset-top));
    }

    .sheet.dragging {
      transition: none;
    }

    .grab {
      display: grid;
      place-items: center;
      height: 24px;
      flex: 0 0 24px;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    .grab:focus {
      outline: none;
    }

    .grab:focus-visible::before {
      background: rgba(15, 123, 131, 0.42);
      box-shadow: 0 0 0 4px rgba(15, 123, 131, 0.12);
    }

    .grab::before {
      content: "";
      width: 44px;
      height: 5px;
      border-radius: 999px;
      background: rgba(16, 36, 42, 0.24);
    }

    .sheet-body {
      min-height: 0;
      overflow: auto;
      padding: 0 12px 14px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }

    .day-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 2px 0 10px;
    }

    .day-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .day-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .day-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--ink);
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }

    .day-picker {
      margin-bottom: 12px;
    }

    .day-select {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 8px 10px;
      border: 1px solid rgba(15, 123, 131, 0.22);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 22px rgba(14, 43, 49, 0.08);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .day-select span:first-child {
      min-width: 76px;
      color: var(--sea-deep);
      font-size: 13px;
      font-weight: 880;
    }

    .day-select strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 860;
    }

    .day-select .chevron {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: var(--sea-deep);
      font-size: 15px;
      font-weight: 900;
      transition: transform 180ms ease;
    }

    .day-picker.open .chevron {
      transform: rotate(180deg);
    }

    .day-strip {
      display: flex;
      gap: 8px;
      max-height: 0;
      margin: 0 -12px;
      padding: 0 12px;
      opacity: 0;
      overflow-x: auto;
      overflow-y: hidden;
      pointer-events: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transition: max-height 200ms ease, opacity 160ms ease, padding 200ms ease, margin 200ms ease;
    }

    .day-picker.open .day-strip {
      max-height: 62px;
      margin: 8px -12px 0;
      padding: 0 12px 2px;
      opacity: 1;
      pointer-events: auto;
    }

    .day-strip::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 auto;
      display: grid;
      min-width: 70px;
      min-height: 42px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms ease, border 160ms ease, background 160ms ease;
    }

    .day-chip:active {
      transform: scale(0.97);
    }

    .day-chip.active {
      color: #fff;
      border-color: var(--sea-deep);
      background: var(--sea-deep);
    }

    .day-chip strong {
      display: block;
      font-size: 13px;
      line-height: 1.1;
      font-weight: 850;
    }

    .day-chip span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.1;
      opacity: 0.78;
    }

    .hero {
      position: relative;
      margin: 0 0 12px;
      overflow: hidden;
      border-radius: var(--radius);
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, rgba(15, 123, 131, 0.2), rgba(238, 111, 87, 0.22));
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    img.photo-fallback {
      object-fit: cover;
      background: linear-gradient(135deg, rgba(15, 123, 131, 0.22), rgba(238, 111, 87, 0.18));
    }

    .hero .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 34px 12px 10px;
      color: #fff;
      background: linear-gradient(180deg, transparent, rgba(5, 20, 24, 0.72));
      font-size: 12px;
      font-weight: 720;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .metric strong {
      display: block;
      margin-top: 3px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 840;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 880;
    }

    .section-title:first-of-type {
      margin-top: 10px;
    }

    .timeline {
      display: grid;
      gap: 8px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .time {
      color: var(--sea-deep);
      font-size: 12px;
      font-weight: 850;
      line-height: 1.3;
    }

    .timeline-item h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.32;
      font-weight: 860;
      overflow-wrap: anywhere;
    }

    .timeline-item p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .stop-grid {
      display: grid;
      gap: 8px;
    }

    .stop-card {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 10px;
      width: 100%;
      min-height: 96px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms ease, border 160ms ease, box-shadow 160ms ease;
    }

    .stop-card:active {
      transform: scale(0.99);
    }

    .stop-card.active {
      border-color: rgba(15, 123, 131, 0.6);
      box-shadow: 0 10px 26px rgba(15, 123, 131, 0.16);
    }

    .stop-card img {
      width: 86px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      background: #d7e4e3;
    }

    .stop-card small {
      color: var(--coral);
      font-size: 11px;
      font-weight: 840;
    }

    .stop-card strong {
      display: block;
      margin-top: 2px;
      font-size: 14px;
      line-height: 1.28;
      font-weight: 880;
      overflow-wrap: anywhere;
    }

    .stop-card p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .stay-box {
      padding: 10px;
      border: 1px solid rgba(59, 123, 94, 0.24);
      border-radius: var(--radius);
      background: rgba(246, 252, 247, 0.94);
    }

    .stay-box h3 {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 880;
    }

    .stay-box p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .footer-note {
      margin: 16px 0 4px;
      color: rgba(16, 36, 42, 0.56);
      font-size: 11px;
      line-height: 1.45;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    .route-marker {
      position: relative;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      background: var(--sea);
      box-shadow: 0 8px 20px rgba(7, 27, 34, 0.22);
      font-size: 11px;
      font-weight: 900;
    }

    .route-marker::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid rgba(15, 123, 131, 0.18);
    }

    .route-marker.active {
      background: var(--coral);
      transform: scale(1.08);
    }

    .route-marker.stay {
      background: var(--green);
    }

    .route-marker.airport {
      background: var(--rose);
    }

    .route-marker.day-d3,
    .route-marker.day-d4,
    .route-marker.day-d5 {
      background: #b36a2e;
    }

    .route-marker.day-d7,
    .route-marker.day-d8,
    .route-marker.day-d9,
    .route-marker.day-d10 {
      background: #286fa3;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 18px 46px rgba(10, 31, 38, 0.24);
    }

    .leaflet-popup-content {
      width: 236px !important;
      margin: 0;
    }

    .popup-card img {
      width: 100%;
      height: 118px;
      display: block;
      object-fit: cover;
      background: #d7e4e3;
    }

    .popup-card div {
      padding: 10px;
    }

    .popup-card small {
      color: var(--coral);
      font-size: 11px;
      font-weight: 840;
    }

    .popup-card h3 {
      margin: 3px 0 4px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.25;
    }

    .popup-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 370px) {
      .brand {
        max-width: calc(100vw - 154px);
        padding: 9px 10px;
      }

      .brand h1 {
        font-size: 15px;
      }

      .timeline-item {
        grid-template-columns: 70px 1fr;
      }

      .stop-card {
        grid-template-columns: 76px 1fr;
      }

      .stop-card img {
        width: 76px;
      }
    }

    @media (max-width: 540px) {
      .offline-status {
        width: 34px;
        padding: 0;
        font-size: 0;
      }
    }

    @media (min-width: 900px) {
      .topbar {
        right: 440px;
      }

      .sheet {
        top: calc(12px + env(safe-area-inset-top));
        right: 12px;
        left: auto;
        bottom: 12px;
        width: 408px;
        height: auto;
        max-height: none;
      }

      .grab {
        display: none;
      }

      .sheet-body {
        padding-top: 14px;
      }

      .day-select {
        display: none;
      }

      .day-strip {
        max-height: none;
        margin: 0 -12px 12px;
        padding: 0 12px 2px;
        opacity: 1;
        pointer-events: auto;
      }

      .brand {
        max-width: 600px;
      }

      .hero {
        aspect-ratio: 1.7;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="西澳自驾路线地图"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div>
          <p>West Coast of AUS</p>
          <h1>西澳自驾路线图</h1>
        </div>
      </div>
      <div class="top-actions">
        <span class="offline-status" id="offlineStatus" aria-live="polite">可离线</span>
        <button class="icon-btn" id="fitRoute" type="button" aria-label="查看全程">⌖</button>
        <button class="icon-btn active" id="toggleStays" type="button" aria-label="显示住宿">⌂</button>
      </div>
    </header>

    <section class="sheet" id="sheet" aria-label="行程详情">
      <button class="grab" id="toggleSheet" type="button" aria-label="展开或收起详情"></button>
      <div class="sheet-body">
        <div class="day-head">
          <div>
            <h2 id="dayTitle"></h2>
            <p id="daySummary"></p>
          </div>
          <span class="day-pill" id="dayBadge"></span>
        </div>

        <div class="day-picker" id="dayPicker">
          <button class="day-select" id="toggleDayPicker" type="button" aria-expanded="false" aria-controls="dayStrip">
            <span id="currentDayLabel"></span>
            <strong id="currentDayTitle"></strong>
            <span class="chevron">⌄</span>
          </button>
          <nav class="day-strip" id="dayStrip" aria-label="选择日期"></nav>
        </div>

        <div class="section-title">当天行程</div>
        <div class="timeline" id="timeline"></div>

        <figure class="hero">
          <img id="dayPhoto" alt="">
          <figcaption class="caption" id="dayCaption"></figcaption>
        </figure>

        <div class="meta-grid">
          <div class="metric">
            <span>主题</span>
            <strong id="dayTheme"></strong>
          </div>
          <div class="metric">
            <span>驾驶</span>
            <strong id="dayDrive"></strong>
          </div>
          <div class="metric">
            <span>穿着</span>
            <strong id="dayWear"></strong>
          </div>
          <div class="metric">
            <span>住宿</span>
            <strong id="dayStayName"></strong>
          </div>
        </div>

        <div class="section-title">地点详情</div>
        <div class="stop-grid" id="stopGrid"></div>

        <div class="section-title">住宿信息</div>
        <div class="stay-box" id="stayBox"></div>

        <p class="footer-note">地图底图来自 Esri World Street Map 与 OpenStreetMap 贡献数据；景点照片使用 Wikimedia/Wikipedia 公开图片源。无信号时路线和行程内容仍可用，底图与照片以已缓存内容为准。住宿地址按文档记录展示，坐标为城区或街道级近似点。</p>
      </div>
    </section>
  </main>

  <script src="./assets/vendor/leaflet/leaflet.js"></script>
  <script>
    function svgDataUri(svg) {
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    const offlinePhoto = svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
        <defs>
          <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#d7e7e8"/>
            <stop offset="0.58" stop-color="#eef3ed"/>
            <stop offset="1" stop-color="#eadfd4"/>
          </linearGradient>
        </defs>
        <rect width="960" height="540" fill="url(#bg)"/>

      },
      {

        theme: "酒庄午餐 / Margaret River 慢游",
        drive: "约 1.5-3 小时",
        wear: "轻松长袖 + 外套",
        stay: "stay-dunsborough",
        cover: photos.busselton,
        caption: "Busselton Jetty",
        timeline: [
          ["09:00", "Dunsborough 出发"],
          ["09:30-12:00", "Busselton Jetty"],

        ],
        stops: [

          stop("d10-winery", "12:30-14:30", "Vasse Felix / Leeuwin Estate / Wise Wine", [-33.796, 115.037], "适合安排正式午餐；司机不要喝酒。", photos.margaretRiver),
          stop("d10-chocolate", "15:00-16:30", "Margaret River Chocolate Company / Providore", [-33.790, 115.103], "下午咖啡和甜点短停。", photos.margaretRiver),

      },
      {
        id: "d11",

        theme: "返程 / 古老叠层石 / 海豚运河",
        drive: "Dunsborough → Perth 约 3.5-4 小时",
        wear: "舒适长途装 + 薄外套",
        stay: "stay-dunsborough",
        cover: photos.mandurah,
        caption: "Mandurah",
        timeline: [
          ["08:30-09:00", "Dunsborough 退房，行李装车"],
          ["09:00-11:00", "Dunsborough → Lake Clifton / Mandurah 方向"],

          ["12:10-13:00", "抵达 Mandurah，午餐"],
          ["13:30-15:00", "Mandurah Dolphin Cruise / canals cruise"],
          ["15:00-16:30", "Mandurah Foreshore、Ocean Marina、Dolphin Quay 散步喝咖啡"],
          ["16:30-17:30", "轻松晚餐或开往 Perth/Fremantle 吃晚餐"],
          ["18:00-20:00", "Perth/Fremantle/Cottesloe 最后一餐、加油"],
          ["20:00-21:00", "还车、整理行李"],
          ["21:00-21:30", "抵达 Perth Airport"],
          ["10/6 00:30", "陆续开始起飞"]
        ],
        stops: [
          stop("d11-dunsborough", "08:30-09:00", "Dunsborough 退房", [-33.617, 115.096], "行李装车，开始北上返程。", photos.dunsborough, "stay"),
          stop("d11-lake", "11:00-11:40", "Lake Clifton Thrombolites", [-32.780, 115.664], "古老叠层石和湖岸步道，适合短停。", photos.mandurah),
          stop("d11-mandurah", "12:10-15:00", "Mandurah Dolphin Cruise", [-32.5289, 115.7231], "重点看海豚和运河水景。", photos.mandurah),
          stop("d11-foreshore", "15:00-16:30", "Mandurah Foreshore / Dolphin Quay", [-32.526, 115.716], "散步、咖啡和最后的轻松海港时间。", photos.mandurah),
          stop("d11-cottesloe", "18:00-20:00", "Perth / Fremantle / Cottesloe", [-31.995, 115.752], "最后一餐、加油，也适合最后看一眼珀斯海岸。", photos.perth),
          stop("d11-airport", "21:00-21:30", "Perth Airport", [-31.9403, 115.9672], "还车后抵达机场，等待 10/6 凌晨航班。", photos.perth, "airport")
        ]
      }
    ];

    function stop(id, time, name, coords, feature, photo, kind = "spot") {
      return { id, time, name, coords, feature, photo, kind };
    }

    const stayById = Object.fromEntries(stays.map((stay) => [stay.id, stay]));
    const allRoutePoints = days.flatMap((day) => day.stops.map((item) => item.coords));
    const map = L.map("map", {
      zoomControl: false,
      tap: true,
      preferCanvas: true,
      inertia: true
    });

    const baseLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      errorTileUrl: offlineTile,
      attribution: "Tiles &copy; Esri; data &copy; OpenStreetMap contributors"
    }).addTo(map);
    baseLayer.on("tileerror", () => setMapOffline(true));
    baseLayer.on("tileload", () => {
      if (navigator.onLine) setMapOffline(false);
    });
    L.control.zoom({ position: "bottomleft" }).addTo(map);

    const mainRoute = L.polyline(allRoutePoints, {
      color: "#0a4f58",
      weight: 3,
      opacity: 0.58,
      dashArray: "7 9",
      lineCap: "round"
    }).addTo(map);

    const dayRoute = L.polyline([], {
      color: "#ee6f57",
      weight: 5,
      opacity: 0.92,
      lineCap: "round"
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    const stayLayer = L.layerGroup().addTo(map);
    const markerRefs = new Map();
    let activeDayIndex = 0;
    let activeStopId = null;
    let staysVisible = true;
    let dayPickerOpen = false;
    let mapTilesOffline = false;
    let appCached = false;

    function setMapOffline(value) {
      mapTilesOffline = value;
      updateOfflineStatus();
    }

    function updateOfflineStatus() {
      const status = document.getElementById("offlineStatus");
      const isFile = window.location.protocol === "file:";
      const isOffline = !navigator.onLine;
      document.body.classList.toggle("offline", isOffline);
      document.body.classList.toggle("map-offline", mapTilesOffline);
      if (!status) return;

      const label = isFile
        ? "本地可用"
        : isOffline || mapTilesOffline
          ? "离线模式"
          : appCached
            ? "已缓存"
            : "可离线";
      status.textContent = label;
      status.setAttribute("aria-label", label);
      status.title = isOffline || mapTilesOffline
        ? "离线时路线和行程可继续查看，照片和底图以已缓存内容为准"
        : "页面会缓存到本机，方便无信号时继续打开";
    }

    document.addEventListener("error", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLImageElement) || target.dataset.fallbackApplied) return;
      target.dataset.fallbackApplied = "true";
      target.classList.add("photo-fallback");
      target.src = offlinePhoto;
    }, true);

    function createIcon(day, kind, active = false) {
      const symbol = kind === "stay" ? "⌂" : kind === "airport" ? "✈" : day.replace("d", "");
      return L.divIcon({
        className: "",
        html: `<div class="route-marker day-${day} ${kind} ${active ? "active" : ""}">${symbol}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -16]
      });
    }

    function popupHtml(item) {
      return `
        <article class="popup-card">
          <img src="${item.photo}" alt="${escapeHtml(item.name)}">
          <div>
            <small>${escapeHtml(item.time)}</small>
            <h3>${escapeHtml(item.name)}</h3>
            <p>${escapeHtml(item.feature)}</p>
          </div>
        </article>
      `;
    }

    days.forEach((day, dayIndex) => {
      day.stops.forEach((item) => {
        const marker = L.marker(item.coords, {
          icon: createIcon(day.id, item.kind),
          title: item.name
        }).addTo(markerLayer);
        marker.bindPopup(popupHtml(item), { closeButton: false, maxWidth: 260 });
        marker.on("click", () => selectStop(dayIndex, item.id));
        markerRefs.set(item.id, marker);
      });
    });

    stays.forEach((stay) => {
      const marker = L.marker(stay.coords, {
        icon: L.divIcon({
          className: "",
          html: `<div class="route-marker stay">⌂</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -16]
        }),
        title: stay.name
      }).addTo(stayLayer);
      marker.bindPopup(`
        <article class="popup-card">
          <img src="${stay.photo}" alt="${escapeHtml(stay.name)}">
          <div>
            <small>${escapeHtml(stay.dates)}</small>
            <h3>${escapeHtml(stay.name)}</h3>
            <p>${escapeHtml(stay.address)} · ${escapeHtml(stay.price)}</p>
          </div>
        </article>
      `, { closeButton: false, maxWidth: 260 });
    });

    function renderDayStrip() {
      const strip = document.getElementById("dayStrip");
      const picker = document.getElementById("dayPicker");
      const toggle = document.getElementById("toggleDayPicker");
      const currentDay = days[activeDayIndex];
      document.getElementById("currentDayLabel").textContent = `${currentDay.label} ${currentDay.date}`;
      document.getElementById("currentDayTitle").textContent = currentDay.title;
      picker.classList.toggle("open", dayPickerOpen);
      toggle.setAttribute("aria-expanded", String(dayPickerOpen));
      strip.innerHTML = days.map((day, index) => `
        <button class="day-chip ${index === activeDayIndex ? "active" : ""}" type="button" data-index="${index}">
          <strong>${day.label}</strong>
          <span>${day.date}</span>
        </button>
      `).join("");
      strip.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => selectDay(Number(button.dataset.index), true));
      });
      const activeChip = strip.querySelector(".day-chip.active");
      if (activeChip) {
        activeChip.scrollIntoView({ block: "nearest", inline: "center" });
      }
    }

    function renderDay() {
      const day = days[activeDayIndex];
      const stay = stayById[day.stay];
      const stop = day.stops.find((item) => item.id === activeStopId) || day.stops[0];

      document.getElementById("dayTitle").textContent = day.title;
      document.getElementById("daySummary").textContent = day.summary;
      document.getElementById("dayBadge").textContent = `${day.label} ${day.date}`;
      document.getElementById("dayPhoto").src = day.cover;
      document.getElementById("dayPhoto").alt = day.caption;
      document.getElementById("dayCaption").textContent = day.caption;
      document.getElementById("dayTheme").textContent = day.theme;
      document.getElementById("dayDrive").textContent = day.drive;
      document.getElementById("dayWear").textContent = day.wear;
      document.getElementById("dayStayName").textContent = stay.name;

      document.getElementById("timeline").innerHTML = day.timeline.map(([time, text]) => `
        <article class="timeline-item">
          <div class="time">${escapeHtml(time)}</div>
          <div>
            <h3>${escapeHtml(text)}</h3>
          </div>
        </article>
      `).join("");

      document.getElementById("stopGrid").innerHTML = day.stops.map((item) => `
        <button class="stop-card ${item.id === stop.id ? "active" : ""}" type="button" data-id="${item.id}">
          <img src="${item.photo}" alt="${escapeHtml(item.name)}">
          <div>
            <small>${escapeHtml(item.time)}</small>
            <strong>${escapeHtml(item.name)}</strong>
            <p>${escapeHtml(item.feature)}</p>
          </div>
        </button>
      `).join("");
      document.getElementById("stopGrid").querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => focusStop(button.dataset.id));
      });

      document.getElementById("stayBox").innerHTML = `
        <h3>${escapeHtml(stay.name)}</h3>
        <p><strong>${escapeHtml(stay.dates)}</strong> · ${escapeHtml(stay.city)}</p>
        <p>${escapeHtml(stay.address)}</p>
        <p>建议区域：${escapeHtml(stay.area)}</p>
        <p>${escapeHtml(stay.price)} · ${escapeHtml(stay.rooms)}</p>
      `;

      renderDayStrip();
      updateMapForDay(stop.id);
    }

    function selectDay(index, fit = false) {
      activeDayIndex = index;
      activeStopId = days[index].stops[0].id;
      dayPickerOpen = false;
      renderDay();
      scrollSheetTop();
      if (fit) {
        fitDay(index);
      }
    }

    function selectStop(dayIndex, stopId) {
      activeDayIndex = dayIndex;
      activeStopId = stopId;
      renderDay();
      const marker = markerRefs.get(stopId);
      if (marker) {
        marker.openPopup();
      }
    }

    function focusStop(stopId) {
      activeStopId = stopId;
      renderDay();
      const marker = markerRefs.get(stopId);
      if (marker) {
        map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 10), {
          duration: 0.65,
          easeLinearity: 0.2
        });
        marker.openPopup();
      }
    }

    function updateMapForDay(stopId) {
      const day = days[activeDayIndex];
      dayRoute.setLatLngs(day.stops.map((item) => item.coords));
      markerRefs.forEach((marker, id) => {
        const markerDay = days.find((candidate) => candidate.stops.some((item) => item.id === id));
        const item = markerDay.stops.find((entry) => entry.id === id);
        const isActive = id === stopId;
        marker.setIcon(createIcon(markerDay.id, item.kind, isActive));
      });
    }

    function fitDay(index) {
      const bounds = L.latLngBounds(days[index].stops.map((item) => item.coords));
      map.fitBounds(bounds.pad(0.2), {
        animate: true,
        duration: 0.65,
        paddingTopLeft: [24, 92],
        paddingBottomRight: window.innerWidth >= 900 ? [440, 24] : [24, 360]
      });
    }

    function fitAll() {
      map.fitBounds(mainRoute.getBounds().pad(0.08), {
        animate: true,
        duration: 0.8,
        paddingTopLeft: [24, 92],
        paddingBottomRight: window.innerWidth >= 900 ? [440, 24] : [24, 330]
      });
    }

    function scrollSheetTop() {
      const body = document.querySelector(".sheet-body");
      if (body) {
        body.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("fitRoute").addEventListener("click", fitAll);
    document.getElementById("toggleStays").addEventListener("click", (event) => {
      staysVisible = !staysVisible;
      event.currentTarget.classList.toggle("active", staysVisible);
      if (staysVisible) {
        stayLayer.addTo(map);
      } else {
        stayLayer.remove();
      }
    });
    let suppressGrabClick = false;
    document.getElementById("toggleSheet").addEventListener("click", () => {
      if (suppressGrabClick) {
        suppressGrabClick = false;
        return;
      }
      const sheet = document.getElementById("sheet");
      if (sheet.classList.contains("expanded")) {
        setSheetSnap("mid");
      } else {
        setSheetSnap("expanded");
      }
      setTimeout(() => map.invalidateSize({ animate: true }), 220);
    });
    document.getElementById("toggleDayPicker").addEventListener("click", () => {
      dayPickerOpen = !dayPickerOpen;
      renderDayStrip();
    });

    const sheet = document.getElementById("sheet");
    const grab = document.getElementById("toggleSheet");
    let dragState = null;

    grab.addEventListener("pointerdown", (event) => {
      if (window.innerWidth >= 900) return;
      dragState = {
        startY: event.clientY,
        startHeight: sheet.getBoundingClientRect().height,
        moved: false
      };
      sheet.classList.add("dragging");
      grab.setPointerCapture(event.pointerId);
    });

    grab.addEventListener("pointermove", (event) => {
      if (!dragState) return;
      const delta = dragState.startY - event.clientY;
      if (Math.abs(delta) > 4) dragState.moved = true;
      const nextHeight = clampSheetHeight(dragState.startHeight + delta);
      sheet.classList.remove("compact", "expanded");
      sheet.style.setProperty("--sheet-height", `${nextHeight}px`);
    });

    grab.addEventListener("pointerup", (event) => {
      if (!dragState) return;
      const currentHeight = sheet.getBoundingClientRect().height;
      const maxHeight = getSheetMaxHeight();
      const wasMoved = dragState.moved;
      dragState = null;
      sheet.classList.remove("dragging");
      if (grab.hasPointerCapture(event.pointerId)) {
        grab.releasePointerCapture(event.pointerId);
      }
      if (!wasMoved) return;
      suppressGrabClick = true;
      if (currentHeight > maxHeight * 0.78) {
        setSheetSnap("expanded");
      } else if (currentHeight < maxHeight * 0.48) {
        setSheetSnap("compact");
      } else {
        setSheetSnap("mid");
      }
    });

    grab.addEventListener("pointercancel", () => {
      dragState = null;
      sheet.classList.remove("dragging");
    });

    window.addEventListener("resize", () => {
      map.invalidateSize();
    });
    window.addEventListener("online", () => {
      setMapOffline(false);
      updateOfflineStatus();
    });
    window.addEventListener("offline", updateOfflineStatus);

    function setSheetSnap(mode) {
      sheet.style.removeProperty("--sheet-height");
      sheet.classList.toggle("compact", mode === "compact");
      sheet.classList.toggle("expanded", mode === "expanded");
      setTimeout(() => map.invalidateSize({ animate: true }), 220);
    }

    function clampSheetHeight(height) {
      const maxHeight = getSheetMaxHeight();
      const minHeight = Math.min(360, Math.max(280, window.innerHeight * 0.38));
      return Math.min(maxHeight, Math.max(minHeight, height));
    }

    function getSheetMaxHeight() {
      return Math.max(360, window.innerHeight - 88);
    }

    renderDayStrip();
    selectDay(0, false);
    fitAll();
    updateOfflineStatus();

    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => navigator.serviceWorker.ready)
          .then(() => {
            appCached = true;
            updateOfflineStatus();
          })
          .catch(() => {
            appCached = false;
            updateOfflineStatus();
          });
      });
    }
  </script>
</body>
